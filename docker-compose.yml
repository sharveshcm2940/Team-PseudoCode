services:
  api:
    build: ./backend
    env_file: ${PALS_ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: sqlite:////app/data/pals.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      JUDGE0_BASE_URL: http://judge0:2358
      REQUEST_TIMEOUT_SECONDS: 120
      FRONTEND_ORIGINS: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["pals-data:/app/data"]
    depends_on: [judge0]
  web:
    build: ./frontend
    ports: ["${PALS_WEB_PORT:-5173}:80"]
    depends_on: [api]
  judge0:
    image: judge0/judge0:1.13.1
    privileged: true
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      MAX_MEMORY_LIMIT: 2048000
    depends_on: [redis, postgres]
  judge0-config:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: judge0
    depends_on:
      judge0:
        condition: service_started
      postgres:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        until psql -h postgres -U judge0 -d judge0 -tAc "SELECT 1 FROM languages WHERE id=62" | grep -q 1; do sleep 1; done; sleep 15;
        psql -h postgres -U judge0 -d judge0 -c "UPDATE languages SET compile_cmd='/usr/local/openjdk13/bin/javac -J-Xms16m -J-Xmx128m -J-Xss512k -J-XX:CompressedClassSpaceSize=32m -J-XX:MaxMetaspaceSize=128m -J-XX:ActiveProcessorCount=2 -J-XX:+UseSerialGC %s Main.java', run_cmd='/usr/local/openjdk13/bin/java -Xms16m -Xmx128m -Xss512k -XX:CompressedClassSpaceSize=32m -XX:MaxMetaspaceSize=128m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC Main' WHERE id=62;"
  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      MAX_MEMORY_LIMIT: 2048000
      JAVA_TOOL_OPTIONS: -Xms16m -Xmx128m -Xss512k
    depends_on:
      judge0-config:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
volumes:
  pals-data:
